name: Refresh Smart Sniper data

on:
  schedule:
    - cron: "7 * * * *"   # every hour, at minute 7
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Pull fresh data from CoinGecko API
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_ENVIRONMENT: pro
        run: python -m app.snapshot_job
      - name: Commit if changed
        run: |
          git config user.name "smart-sniper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Refresh data from CoinGecko API"
          git push
